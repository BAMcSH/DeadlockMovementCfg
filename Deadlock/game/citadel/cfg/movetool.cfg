// MoveTool cfg by Leif (youtube.com/@leifdeadlock)

// Change Save and Load binds to things you'd like them to be.
// They can't already be bound to any existing game mechanics in settings.
// Saving and Loading position will not work without the powershell script.
bind	"H"      "getpos_exact"
bind	"T"      "exec lastpos.cfg"

// Change the 5 and 6 to the keys you'd like for cycling spots in a list. 
// They can't already be bound to any game mechanics.
bind 5 leif_cyclef // Forward
bind 7 leif_current // Return to last used
bind 6 leif_cycleb // Backward

bind	"U" 	"noclip"
bind	"F8"	"map dl_midtown"										// Load into midtown
bind	"F9"	"teamtoggle"											// Quick swap teams
bind	"F10"	"quickstart"											// Toggle testing controller, and other things
bind	"F11"	"postoggle"												// Cycle cl_showpos 0, 1, and 2
bind	"F12"	"toggle citadel_hud_visible"							// Toggle hud
bind	"M"		"toggle citadel_hud_visible; toggle cl_lock_camera"		// Toggle hud and lock camera (I use this a lot when recording)
bind	"N"		"toggle citadel_camera_inspect_mode"					// Toggle inspect (orbit char with camera)
	
alias team1 "changeteam 2; alias teamtoggle team2"
alias team2 "changeteam 3; alias teamtoggle team1"
alias teamtoggle "team1"

/// Enable testing controller, enable speed graph, change graph duration to 10s, disable neutral camps and rift spawns, toggle AI targeting you (for towers), reset to acquire abilities
alias quickstart "spawn_hero_testing_controller; citadel_show_movespeed_on_hud true; citadel_movespeed_graph_duration 10; citadel_neutral_spawn_enabled false; citadel_koth_enabled false; notarget; resetme"

alias posoff "cl_showpos 0; alias postoggle posang"
alias posang "cl_showpos 1; alias postoggle pospos"
alias pospos "cl_showpos 2; alias postoggle posoff"
alias postoggle "posang"

// If adding to this file, add above this line, the rest is generated by the powershell script.
// Autoexec Section
exec leiflanes
exec leifvents
exec leifzips
exec leifzips2
alias leifhelp "echoln Type any of the following names to load their lists:;echoln leiflanes;echoln leifvents;echoln leifzips;echoln leifzips2;"
